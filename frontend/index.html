<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Document Q&A</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  #chat { border: 1px solid #ddd; border-radius: 8px; height: 380px; overflow-y: auto; padding: 12px; }
  .msg { margin: 8px 0; } .user { text-align: right; color: #2563eb; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 18px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h2>📄 RAG Document Q&A Assistant</h2>
<div id="chat"></div>
<div class="row">
  <input id="q" placeholder="Ask a question about your documents...">
  <button onclick="ask()">Ask</button>
</div>
<script>
const API = "http://localhost:5000";
const chat = document.getElementById("chat");
function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
async function ask() {
  const input = document.getElementById("q");
  const question = input.value.trim(); if (!question) return;
  add(question, "user"); input.value = "";
  try {
    const r = await fetch(API + "/ask", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    const data = await r.json();
    add(data.answer || ("Error: " + data.error), "bot");
  } catch (e) { add("Could not reach the API. Is the server running?", "bot"); }
}
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
